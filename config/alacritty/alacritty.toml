# amalthea - alacritty
# GM45 only exposes OpenGL 2.1 / GLES 2.0, which rules out kitty and ghostty
# (both want GL 3.3). alacritty's GLES2 path runs fine on the crocus driver.

[env]
TERM = "alacritty"

[window]
padding = { x = 10, y = 8 }
dynamic_padding = false
decorations = "none"
opacity = 1.0
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
size = 10.5
normal = { family = "Terminess Nerd Font Mono", style = "Regular" }
bold = { family = "Terminess Nerd Font Mono", style = "Bold" }
italic = { family = "Terminess Nerd Font Mono", style = "Italic" }
bold_italic = { family = "Terminess Nerd Font Mono", style = "Bold Italic" }
offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# colors: amalthea steel ------------------------------------------------------

[colors.primary]
background = "#0a0a0b"
foreground = "#e4e6e9"
dim_foreground = "#8b9097"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#0a0a0b"
cursor = "#6f94ac"

[colors.vi_mode_cursor]
text = "#0a0a0b"
cursor = "#9fb0ba"

[colors.selection]
text = "CellForeground"
background = "#202327"

[colors.search.matches]
foreground = "#0a0a0b"
background = "#9fb0ba"

[colors.search.focused_match]
foreground = "#0a0a0b"
background = "#6f94ac"

[colors.footer_bar]
foreground = "#e4e6e9"
background = "#16181b"

[colors.hints.start]
foreground = "#0a0a0b"
background = "#9fb0ba"

[colors.hints.end]
foreground = "#0a0a0b"
background = "#8b9097"

[colors.normal]
black   = "#16181b"
red     = "#6f94ac"
green   = "#7a9a84"
yellow  = "#9fb0ba"
blue    = "#5f7e91"
magenta = "#8a7a95"
cyan    = "#6f9690"
white   = "#d6c5bd"

[colors.bright]
black   = "#3a3e44"
red     = "#d98a70"
green   = "#8fab97"
yellow  = "#a89a6e"
blue    = "#6a8ba3"
magenta = "#8a7a95"
cyan    = "#8fb3ac"
white   = "#e4e6e9"

[colors.dim]
black   = "#0f1012"
red     = "#b3555a"
green   = "#79824f"
yellow  = "#a8834a"
blue    = "#5f7285"
magenta = "#8f616e"
cyan    = "#6b877e"
white   = "#8b9097"

# keybinds -------------------------------------------------------------------
# tmux owns splits and tabs, so alacritty only needs the basics

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
