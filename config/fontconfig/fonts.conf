<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- amalthea: Terminus (as Terminess Nerd Font Mono) everywhere. it's a
	     bitmap-derived font with no ligatures and no hinting ambiguity, so it
	     stays pixel-crisp at 10pt on a 768px panel and costs less to
	     rasterize than a vector face - the whole point on a Core 2 Duo. one
	     font for every slot, monospace included, is itself the point: this is
	     a terminal-first machine. -->

	<alias>
		<family>monospace</family>
		<prefer><family>Terminess Nerd Font Mono</family></prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer><family>Terminess Nerd Font Mono</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer><family>Terminess Nerd Font Mono</family></prefer>
	</alias>
	<alias>
		<family>system-ui</family>
		<prefer><family>Terminess Nerd Font Mono</family></prefer>
	</alias>

	<!-- emoji never wins a latin codepoint, it only fills the gaps -->
	<match target="pattern">
		<test name="family"><string>emoji</string></test>
		<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<!-- subpixel rendering: this is a 1366x768 TN panel, it needs all the help
	     it can get and there is no hidpi to hide behind -->
	<match target="font">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="hinting" mode="assign"><bool>true</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
		<edit name="rgba" mode="assign"><const>rgb</const></edit>
		<edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
		<edit name="autohint" mode="assign"><bool>false</bool></edit>
	</match>
</fontconfig>
