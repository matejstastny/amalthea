# amalthea - GM45 (Mobile Intel 4 Series)
#
# modesetting + glamor wants a usable GL, and this chip only has 2.1, so the
# generic driver ends up doing most 2D in software. xf86-video-intel's SNA
# acceleration is hand-written 2D and is the mature path for gen4; it is only
# "deprecated" for the newer chips that glamor serves better.
Section "Device"
	Identifier  "Intel Graphics"
	Driver      "intel"
	Option      "AccelMethod"  "sna"
	Option      "TearFree"     "true"
	Option      "DRI"          "3"
EndSection
