# amalthea - picom
# the glx backend wants GL 3.0 and this chipset tops out at 2.1, so xrender is
# the only option. that also means no blur: xrender has no shader stage.
# everything here is deliberately cheap - two cores have better things to do.

backend = "xrender";
vsync = true;

# rounded corners, smaller than the 15 on asahi because 1366x768 is a small
# canvas and 15 reads as a bubble at this size
corner-radius = 10;
round-borders = 1;
rounded-corners-exclude = [
	"window_type = 'dock'",
	"class_g = 'Polybar'",
	"class_g = 'i3-frame'"
];

# transparency, enough to see the wallpaper through a terminal and no more
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
	"100:class_g = 'firefox'",
	"100:class_g = 'helium'",
	"100:class_g = 'mpv'",
	"100:fullscreen"
];

# no shadows and no blur: both are pure cost on this gpu
shadow = false;
blur-background = false;

fading = true;
fade-in-step = 0.12;
fade-out-step = 0.12;
fade-delta = 8;
fade-exclude = [ "class_g = 'Polybar'" ];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
unredir-if-possible = true;

wintypes:
{
	dock          = { shadow = false; };
	tooltip       = { fade = true; shadow = false; focus = true; };
	popup_menu    = { opacity = 1.0; };
	dropdown_menu = { opacity = 1.0; };
};
