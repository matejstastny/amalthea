# amalthea - same layout pair as asahi (alt+k toggles), but no modifier swap:
# that one is there for a mac keyboard, this is a normal thinkpad.
Section "InputClass"
	Identifier  "system-keyboard"
	MatchIsKeyboard "on"
	Option      "XkbLayout"  "us,cz"
	Option      "XkbVariant" ",qwerty"
EndSection
