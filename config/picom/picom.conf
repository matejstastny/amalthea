# amalthea - picom
# the glx backend wants GL 3.0 and this chipset tops out at 2.1, so xrender is
# the only option. that also means no blur: xrender has no shader stage.
# everything here is deliberately cheap - two cores have better things to do.
#
# steel is square and opaque: no rounded corners, no transparency, no fading.
# that is not just the look, it is less compositing work every frame. the
# only job left for picom is tear-free vsync.

backend = "xrender";
vsync = true;

corner-radius = 0;

# fully opaque, nothing fades
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
fading = false;

# no shadows and no blur: both are pure cost on this gpu
shadow = false;
blur-background = false;

detect-transient = true;
use-damage = true;
unredir-if-possible = true;

wintypes:
{
	dock          = { shadow = false; };
	tooltip       = { fade = true; shadow = false; focus = true; };
	popup_menu    = { opacity = 1.0; };
	dropdown_menu = { opacity = 1.0; };
};
