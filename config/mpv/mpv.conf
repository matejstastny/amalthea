# amalthea - mpv
# gm45 can hardware-decode h264 and mpeg2 through the old i965 vaapi driver,
# which is the difference between smooth 1080p and a slideshow on two cores.

vo=gpu
gpu-context=x11egl
gpu-api=opengl
hwdec=vaapi
hwdec-codecs=h264,mpeg2video,vc1,wmv3

# gl 2.1 means no fancy scalers; bilinear is what this chip can actually do
scale=bilinear
cscale=bilinear
dscale=bilinear
dither-depth=no
correct-downscaling=no
sigmoid-upscaling=no
deband=no

profile=fast
vd-lavc-threads=2

osd-font=Iosevka Nerd Font
osd-font-size=28
osd-color='#f0e4de'
osd-border-color='#16100f'
osd-bar=yes

volume=90
volume-max=130
keep-open=yes
save-position-on-quit=yes
screenshot-directory=~/pictures/screenshots
screenshot-template='mpv-%F-%P'

# anything above 1080p will not play on this machine; cap youtube-dl
ytdl-format=bestvideo[height<=?720]+bestaudio/best
