[manager]
cwd = { fg = "#6f94ac" }

hovered         = { fg = "#e4e6e9", bg = "#16181b", bold = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#8a7a95", italic = true }
find_position = { fg = "#6f94ac", bg = "reset", bold = true }

marker_copied   = { fg = "#8a7a95", bg = "#8a7a95" }
marker_cut      = { fg = "#8a7a95", bg = "#8a7a95" }
marker_marked   = { fg = "#6f94ac", bg = "#6f94ac" }
marker_selected = { fg = "#8a7a95", bg = "#8a7a95" }

tab_active   = { fg = "#e4e6e9", bg = "#16181b", bold = true }
tab_inactive = { fg = "#8b9097", bg = "#050506" }

count_copied   = { fg = "#050506", bg = "#8a7a95" }
count_cut      = { fg = "#050506", bg = "#8a7a95" }
count_selected = { fg = "#050506", bg = "#6f94ac" }

border_symbol = "│"
border_style  = { fg = "#3a3e44" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#16181b", bg = "#050506" }

mode_normal = { fg = "#050506", bg = "#6f94ac", bold = true }
mode_select = { fg = "#050506", bg = "#8a7a95", bold = true }
mode_unset  = { fg = "#050506", bg = "#8b9097", bold = true }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#6f94ac", bg = "#050506" }
progress_error  = { fg = "#8a7a95", bg = "#050506" }

permissions_t = { fg = "#6f94ac" }
permissions_r = { fg = "#8a7a95" }
permissions_w = { fg = "#9fb0ba" }
permissions_x = { fg = "#8fab97" }
permissions_s = { fg = "#8b9097" }

[input]
border   = { fg = "#6f94ac" }
title    = { fg = "#8b9097" }
value    = { fg = "#e4e6e9" }
selected = { reversed = true }

[completion]
border   = { fg = "#3a3e44" }
active   = { bg = "#16181b" }
inactive = { bg = "#050506" }

[tasks]
border  = { fg = "#3a3e44" }
title   = { fg = "#8b9097" }
hovered = { fg = "#6f94ac", underline = true }

[which]
mask            = { bg = "#0a0a0b" }
cand            = { fg = "#6f94ac" }
rest            = { fg = "#8b9097" }
desc            = { fg = "#e4e6e9" }
separator       = "  "
separator_style = { fg = "#3a3e44" }

[help]
on      = { fg = "#6f94ac" }
run     = { fg = "#8a7a95" }
desc    = { fg = "#8b9097" }
hovered = { bg = "#16181b", bold = true }
footer  = { fg = "#e4e6e9", bg = "#050506" }

[filetype]
rules = [
  { mime = "image/*",                     fg = "#8a7a95" },
  { mime = "video/*",                     fg = "#6f94ac" },
  { mime = "audio/*",                     fg = "#6f94ac" },
  { mime = "application/zip",             fg = "#9fb0ba" },
  { mime = "application/x-tar",           fg = "#9fb0ba" },
  { mime = "application/gzip",            fg = "#9fb0ba" },
  { mime = "application/x-bzip2",         fg = "#9fb0ba" },
  { mime = "application/x-7z-compressed", fg = "#9fb0ba" },
  { mime = "inode/directory",             fg = "#6f94ac", bold = true },
  { url = "**/*.toml", fg = "#9fb0ba" },
  { url = "**/*.json", fg = "#9fb0ba" },
  { url = "**/*.yaml", fg = "#9fb0ba" },
  { url = "**/*.yml",  fg = "#9fb0ba" },
  { url = "**/*.md",   fg = "#8b9097" },
  { url = "**/*.lua",  fg = "#6f94ac" },
  { url = "**/*.ts",   fg = "#6f94ac" },
  { url = "**/*.tsx",  fg = "#6f94ac" },
  { url = "**/*.js",   fg = "#6f94ac" },
  { url = "**/*.jsx",  fg = "#6f94ac" },
  { url = "**/*.rs",   fg = "#8a7a95" },
  { url = "**/*.go",   fg = "#8fb3ac" },
  { url = "**/*.py",   fg = "#9fb0ba" },
  { url = "**/*.sh",   fg = "#8fab97" },
  { url = "**/*.zsh",  fg = "#8fab97" },
]
