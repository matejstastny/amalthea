; amalthea - polybar
; slim bar, left workspaces / right status. nothing here is clickable-only:
; every module has a keybind or a rofi menu that does the same job.

[colors]
base     = #16100f
mantle   = #1b1413
surface  = #241a18
overlay  = #30231f
muted    = #4a3832
dim      = #a8928a
text     = #f0e4de
bright   = #fff8f4
ember    = #c4745a
amber    = #c9a05e
rust     = #a85540
sage     = #96a06b
slate    = #7a8fa6

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26pt
radius = 0
background = ${colors.base}
foreground = ${colors.text}

line-size = 2pt
border-size = 0pt
padding-left = 1
padding-right = 1
module-margin = 1

separator = "·"
separator-foreground = ${colors.muted}

font-0 = Iosevka Nerd Font:style=Regular:size=10;2
font-1 = Iosevka Nerd Font:style=Bold:size=10;2
font-2 = Symbols Nerd Font Mono:size=12;2

modules-left = i3 title
modules-right = tailscale pulseaudio backlight memory cpu temperature wlan battery date

cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false

tray-position = ${env:TRAY_POS:none}
tray-padding = 4
tray-maxsize = 16
tray-background = ${colors.base}

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

ws-icon-default = 
format = <label-state><label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.base}
label-mode-background = ${colors.amber}

label-focused = %index%
label-focused-foreground = ${colors.base}
label-focused-background = ${colors.ember}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.text}
label-visible-background = ${colors.overlay}
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.base}
label-urgent-background = ${colors.rust}
label-urgent-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:70:…%
label-foreground = ${colors.dim}
label-padding = 1

[module/tailscale]
type = custom/script
exec = $HOME/dotfiles/scripts/bar-tailscale.sh
interval = 20
format-foreground = ${colors.slate}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.text}
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.muted}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.ember}
click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = acpi_video0
use-actual-brightness = true
poll-interval = 0
format = <label>
label = 󰃞 %percentage%%
label-foreground = ${colors.text}

[module/memory]
type = internal/memory
interval = 5
format = <label>
label = 󰍛 %percentage_used%%
label-foreground = ${colors.text}
warn-percentage = 85

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
label = 󰻠 %percentage%%
label-foreground = ${colors.text}
warn-percentage = 90

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 0
base-temperature = 45
warn-temperature = 82
format = <label>
format-warn = <label-warn>
label = %temperature-c%
label-foreground = ${colors.text}
label-warn = %temperature-c%
label-warn-foreground = ${colors.rust}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = 󰤨 %essid%
label-connected-foreground = ${colors.text}
label-disconnected = 󰤭 offline
label-disconnected-foreground = ${colors.muted}

[module/battery]
type = internal/battery
full-at = 98
low-at = 15
battery = BAT1
adapter = ACAD
poll-interval = 10

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 full
label-full-foreground = ${colors.sage}
label-low = %percentage%% low
label-low-foreground = ${colors.rust}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁽
ramp-capacity-3 = 󰁿
ramp-capacity-4 = 󰂁
ramp-capacity-foreground = ${colors.text}

animation-charging-0 = 󰂄
animation-charging-1 = 󰂋
animation-charging-framerate = 900
animation-charging-foreground = ${colors.sage}

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %date%  %{F#c4745a}%time%%{F-}

[settings]
screenchange-reload = true
pseudo-transparency = false
