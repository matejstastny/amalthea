; amalthea - polybar
; slim bar, left workspaces / right status. nothing here is clickable-only:
; every module has a keybind or a rofi menu that does the same job.
; plain-text tags (CPU/MEM/BAT/...) instead of nerd-font glyphs: one less
; font to load, and it reads like an old status bar instead of a dashboard.

[colors]
base     = #0a0a0b
mantle   = #0f1012
surface  = #16181b
overlay  = #202327
muted    = #3a3e44
dim      = #8b9097
text     = #e4e6e9
bright   = #ffffff
ember    = #6f94ac
amber    = #9fb0ba
rust     = #b3555a
sage     = #7a9a84
slate    = #5f7e91

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26pt
radius = 0
background = ${colors.base}
foreground = ${colors.text}

line-size = 2pt
border-size = 0pt
padding-left = 1
padding-right = 1
module-margin = 1

separator = "|"
separator-foreground = ${colors.muted}

font-0 = Terminess Nerd Font Mono:style=Regular:size=10;2
font-1 = Terminess Nerd Font Mono:style=Bold:size=10;2

modules-left = i3 title
modules-right = tailscale pulseaudio backlight memory cpu temperature wlan battery date

cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false

tray-position = ${env:TRAY_POS:none}
tray-padding = 4
tray-maxsize = 16
tray-background = ${colors.base}

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

format = <label-state><label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.base}
label-mode-background = ${colors.amber}

label-focused = %index%
label-focused-foreground = ${colors.base}
label-focused-background = ${colors.ember}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.text}
label-visible-background = ${colors.overlay}
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.base}
label-urgent-background = ${colors.rust}
label-urgent-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:70:…%
label-foreground = ${colors.dim}
label-padding = 1

[module/tailscale]
type = custom/script
exec = $HOME/dotfiles/scripts/bar-tailscale.sh
interval = 20
format-foreground = ${colors.slate}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-volume-foreground = ${colors.text}
label-muted = "VOL muted"
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = acpi_video0
use-actual-brightness = true
poll-interval = 0
format = <label>
label = BL %percentage%%
label-foreground = ${colors.text}

[module/memory]
type = internal/memory
interval = 5
format = <label>
label = MEM %percentage_used%%
label-foreground = ${colors.text}
warn-percentage = 85

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
label = CPU %percentage%%
label-foreground = ${colors.text}
warn-percentage = 90

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 0
base-temperature = 45
warn-temperature = 82
format = <label>
format-warn = <label-warn>
label = TEMP %temperature-c%
label-foreground = ${colors.text}
label-warn = TEMP %temperature-c%
label-warn-foreground = ${colors.rust}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = NET %essid%
label-connected-foreground = ${colors.text}
label-disconnected = NET offline
label-disconnected-foreground = ${colors.muted}

[module/battery]
type = internal/battery
full-at = 98
low-at = 15
battery = BAT1
adapter = ACAD
poll-interval = 10

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-charging = CHG %percentage%%
label-charging-foreground = ${colors.sage}
label-discharging = BAT %percentage%%
label-full = BAT full
label-full-foreground = ${colors.sage}
label-low = BAT %percentage%% low
label-low-foreground = ${colors.rust}

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %date%  %{F#6f94ac}%time%%{F-}

[settings]
screenchange-reload = true
pseudo-transparency = false
